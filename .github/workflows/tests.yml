name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app.py agent tests
      - run: python -m pytest -q
      - run: >-
          python -m ruff check
          agent/drive_uploader.py
          agent/batch_store.py
          tests/test_drive.py
          tests/test_downloads.py
          --ignore BLE001
